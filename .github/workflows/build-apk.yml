name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize uploaded files into Flutter folders
        run: |
          mkdir -p lib/models lib/services assets/fonts
          for f in form_template.dart quiz_models.dart; do
            [ -f "$f" ] && mv -f "$f" "lib/models/$f"
          done
          for f in local_database.dart omr_scanner_engine.dart pdf_sheet_generator.dart; do
            [ -f "$f" ] && mv -f "$f" "lib/services/$f"
          done
          [ -f "main.dart" ] && mv -f "main.dart" "lib/main.dart"
          true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Sarabun Thai Fonts for Offline PDF
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Sarabun-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Regular.ttf"
          curl -fsSL -o assets/fonts/Sarabun-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Bold.ttf"

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --org com.quickgrade.omr --project-name zipgrade_offline_app
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android permissions, minSdk 24 & compileSdk
        run: |
          python3 - << 'PY'
          import os
          import re
          from pathlib import Path

          # 1. Add CAMERA permission to AndroidManifest.xml
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.CAMERA" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application',
                  1,
              )
              manifest.write_text(text, encoding="utf-8")

          # 2. Detect highest installed Android SDK platform
          sdk_candidates = []
          for env_var in ("ANDROID_HOME", "ANDROID_SDK_ROOT"):
              val = os.environ.get(env_var)
              if val:
                  sdk_candidates.append(Path(val) / "platforms")
          sdk_candidates.append(Path("/usr/local/lib/android/sdk/platforms"))

          apis = []
          for pdir in sdk_candidates:
              if pdir.is_dir():
                  for child in pdir.iterdir():
                      m = re.fullmatch(r"android-(\d+)", child.name)
                      if m:
                          apis.append(int(m.group(1)))
          target_sdk = max(apis) if apis else 37
          print(f"Using target compileSdk: {target_sdk} (detected: {sorted(set(apis))})")

          def patch_compile_sdk(content: str, sdk: int) -> str:
              return re.sub(
                  r"(?m)^(\s*)(compileSdkVersion|compileSdk)(\s*=\s*|\s+)(?:flutter\.compileSdkVersion|\d+)\b",
                  lambda m: f"{m.group(1)}{m.group(2)}{m.group(3)}{sdk}",
                  content,
              )

          # 3. Patch :app minSdk=24 and compileSdk=target_sdk
          for fname in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(fname)
              if p.exists():
                  g = p.read_text(encoding="utf-8")
                  g = re.sub(r"minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)", "minSdk = 24", g)
                  g = re.sub(r"minSdkVersion\s+(?:flutter\.minSdkVersion|\d+)", "minSdkVersion 24", g)
                  g = patch_compile_sdk(g, target_sdk)
                  p.write_text(g, encoding="utf-8")
                  print(f"Patched app gradle: {p}")

          # 4. Patch pub-cache plugins whose compileSdk is hardcoded or uses flutter.compileSdkVersion
          pub_dirs = []
          if os.environ.get("PUB_CACHE"):
              pub_dirs.append(Path(os.environ["PUB_CACHE"]))
          pub_dirs.append(Path.home() / ".pub-cache")

          seen = set()
          for pub_dir in pub_dirs:
              hosted = pub_dir / "hosted"
              if not hosted.is_dir():
                  continue
              for gradle_file in list(hosted.glob("*/*/android/build.gradle")) + list(hosted.glob("*/*/android/build.gradle.kts")):
                  rp = gradle_file.resolve()
                  if rp in seen:
                      continue
                  seen.add(rp)
                  orig = gradle_file.read_text(encoding="utf-8")
                  updated = patch_compile_sdk(orig, target_sdk)
                  if updated != orig:
                      gradle_file.write_text(updated, encoding="utf-8")
                      print(f"Patched plugin compileSdk: {gradle_file}")
          PY

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickGrade-Offline-OMR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
