name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize uploaded files into Flutter folders
        run: |
          mkdir -p lib/models lib/services assets/fonts
          [ -f main.dart ] && mv main.dart lib/main.dart || true
          [ -f form_template.dart ] && mv form_template.dart lib/models/form_template.dart || true
          [ -f quiz_models.dart ] && mv quiz_models.dart lib/models/quiz_models.dart || true
          [ -f local_database.dart ] && mv local_database.dart lib/services/local_database.dart || true
          [ -f omr_scanner_engine.dart ] && mv omr_scanner_engine.dart lib/services/omr_scanner_engine.dart || true
          [ -f pdf_sheet_generator.dart ] && mv pdf_sheet_generator.dart lib/services/pdf_sheet_generator.dart || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Sarabun Thai Fonts for Offline PDF
        run: |
          curl -fsSL -o assets/fonts/Sarabun-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Regular.ttf"
          curl -fsSL -o assets/fonts/Sarabun-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Bold.ttf"

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --org com.quickgrade.omr --project-name zipgrade_offline_app
          rm -f test/widget_test.dart

      - name: Configure AndroidManifest CAMERA permission & minSdk 24
        run: |
          python3 -c '
          import re
          from pathlib import Path
          m = Path("android/app/src/main/AndroidManifest.xml")
          t = m.read_text(encoding="utf-8")
          if "android.permission.CAMERA" not in t:
              t = t.replace("<application", "    <uses-permission android:name=\"android.permission.CAMERA\"/>\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"/>\n    <application", 1)
              m.write_text(t, encoding="utf-8")
          for f in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(f)
              if p.exists():
                  g = p.read_text(encoding="utf-8")
                  g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", g)
                  g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g)
                  g = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", g)
                  g = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", g)
                  p.write_text(g, encoding="utf-8")
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Bump opencv_dart compileSdk to match AndroidX
        run: |
          python3 -c '
          import os, re
          from pathlib import Path
          sdk_root = Path(os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk")
          sdks = sorted([int(d.name.split("-")[1].split(".")[0]) for d in (sdk_root / "platforms").glob("android-*") if d.name.split("-")[1].split(".")[0].isdigit()])
          sdk = str(sdks[-1]) if sdks else "35"
          print("Using compileSdk:", sdk)
          pub_cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          for p in pub_cache.rglob("opencv_dart*/android/build.gradle*"):
              t = p.read_text(encoding="utf-8")
              t = re.sub(r"compileSdkVersion\s+\d+", f"compileSdkVersion {sdk}", t)
              t = re.sub(r"compileSdk\s*=?\s*\d+", f"compileSdk {sdk}", t)
              p.write_text(t, encoding="utf-8")
              print("Patched:", p)
          '

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickGrade-Offline-OMR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
