name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Sarabun Thai Fonts for Offline PDF
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Sarabun-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Regular.ttf"
          curl -fsSL -o assets/fonts/Sarabun-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/sarabun/Sarabun-Bold.ttf"

      - name: Generate Android platform files
        run: |
          flutter create . --platforms=android --org com.quickgrade.omr --project-name zipgrade_offline_app

      - name: Configure AndroidManifest CAMERA permission & minSdk 24
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.CAMERA" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application',
                  1,
              )
              manifest.write_text(text, encoding="utf-8")

          for fname in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(fname)
              if p.exists():
                  g = p.read_text(encoding="utf-8")
                  g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", g)
                  g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", g)
                  g = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 24", g)
                  g = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 24", g)
                  p.write_text(g, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickGrade-Offline-OMR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
